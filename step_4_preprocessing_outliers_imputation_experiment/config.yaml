# =============================================================================
# Predicting Bagrut Success — Step 4 Configuration
# Preprocessing, Outlier Detection & the Multi-Iteration MICE Robustness Experiment
# Project: Predicting Bagrut Success from Municipal Socioeconomics and
#          School-Level Institutional Resources
# Authors: Yousef Shihade & Shada Esawi
#
# The masking experiment repeats N_ITERATIONS times with
# different random seeds, reporting mean +/- std across runs instead of a
# single R^2. Our review of the imputation literature showed that a single
# masked run is not sufficient evidence of stability — the accepted practice
# is to report a distribution over many independent draws. Outlier detection
# and the exploratory questions round out the step, both operating
# on the full engineered feature space.
# =============================================================================

project:
  title: "Predicting Bagrut Success from Municipal Socioeconomics and School-Level Institutional Resources"
  authors:
    - "Yousef Shihade"
    - "Shada Esawi"

seed: 42

paths:
  school_level_in: "../step_3_feature_engineering_target_setup/data/school_level_features_targets.csv"
  out_data:        "data"
  out_graphs:      "graphs"
  cleaned_out:     "data/cleaned_modeling_ready.csv"
  mice_runs_out:   "data/mice_robustness_runs.csv"
  mice_variants_out: "data/mice_predictor_variants.csv"

io:
  encoding: "utf-8-sig"

targets:
  - "math_avg_grade"
  - "english_avg_grade"
  - "math_5unit_participation"
  - "english_5unit_participation"

# --- MICE imputation robustness experiment (multi-iteration) --------
imputation_experiment:
  # index_value (the CBS continuous socioeconomic score) is 100% complete on
  # cluster-present rows and strongly structured -> cleanly contrasts MICE vs a
  # median baseline against a fully-observed column, so the truth is known.
  target_feature: "index_value"
  mask_fraction: 0.08          # within the required 5-10% band
  mice_max_iter: 15
  n_iterations: 25             # NEW: independent random-seed repeats for stability evidence
  # Numeric predictors IterativeImputer (MICE) may use — includes the
  # budget-derived features, so the demonstration reflects the richer dataset.
  predictors:
    - "cluster"
    - "index_value"
    - "population"
    - "math_avg_grade"
    - "english_avg_grade"
    - "math_5unit_participation"
    - "english_5unit_participation"
    - "math_takers_total"
    - "english_takers_total"
    - "total_budget_per_student"
    - "teaching_budget_per_student"
    - "avg_class_size"
    - "nurture_quintile"
    - "special_ed_share"
  # The headline run above keeps every available predictor, which is the
  # realistic setting. It is however flattered by `cluster`, a 1-10 discretisation
  # of the very feature being reconstructed (r = 0.97), and it includes the four
  # outcome variables. These variants re-run the identical protocol with those
  # predictors withheld, so the reported advantage can be read without the
  # near-duplicate doing the work. Results -> data/mice_predictor_variants.csv
  variants:
    full: []                                        # drop nothing (headline)
    no_cluster: ["cluster"]
    no_targets: ["math_avg_grade", "english_avg_grade",
                 "math_5unit_participation", "english_5unit_participation"]
    no_cluster_no_targets: ["cluster", "math_avg_grade", "english_avg_grade",
                            "math_5unit_participation", "english_5unit_participation"]

# --- Outlier detection (unchanged method, richer feature space) -----
outliers:
  contamination: 0.05
  lof_neighbors: 20
  features:
    - "combined_avg_grade"
    - "math_5unit_participation"
    - "english_5unit_participation"
    - "cluster"
    - "index_value"
    - "log_population"
    - "log_total_takers"
    - "total_budget_per_student"     # NEW: institutional resourcing dimension
    - "avg_class_size"               # NEW: pedagogical resourcing dimension

# --- Exploratory questions ------------------------------------------
exploratory:
  resilience_low_cluster: 2
  resilience_high_cluster: 9
  overachiever_low_clusters: [1, 2, 3, 4]
  overachiever_elite_clusters: [8, 9, 10]
  overachiever_benchmark: "median"
